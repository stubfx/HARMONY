<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
        <title>HARMONY</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
        <style>html,body{background:#000;margin:0}</style>
    </head>
    <body>
        <script type="module" src="./main.js"></script>
        <div id="aura"></div>
        <div id="tap-hint">
            <div id="hint-hand">
                <svg id="hint-svg" width="40" height="54" viewBox="0 0 40 54" fill="none"
                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="15" y="0"  width="10" height="32" rx="5"/>
                    <rect x="25" y="14" width="9"  height="20" rx="4.5" opacity=".55"/>
                    <rect x="6"  y="14" width="9"  height="20" rx="4.5" opacity=".55"/>
                    <rect x="6"  y="26" width="28" height="20" rx="8"/>
                    <rect x="17" y="3"  width="4"  height="12" rx="2" fill="white" opacity=".25"/>
                </svg>
                <div id="hint-ring"></div>
            </div>
            <span id="tap-sub">touch to begin</span>
        </div>
        <div id="audio-hint" class="hidden">enable audio</div>
        <!-- step-debug: intentional debug element — shows current story phase number. keep it. -->
    <div id="step-debug"></div>
        <div id="harmony-panel">
            <canvas id="note-canvas"></canvas>
        </div>
    </body>
</html>
